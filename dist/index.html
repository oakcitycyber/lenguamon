<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Lenguamon: Persian Edition</title>
<meta name="theme-color" content="#2a1f3d">
<style>
:root { --u: 3px; --ink: #1c2234; --paper: #fbf6e8; --tq: #1a8f8c; --gold: #e0b040; --navy: #233a7a; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: #228b22;
  background-image: radial-gradient(ellipse at 50% 35%, #2a9a2a 0, #228b22 45%, #186a18 100%);
  color: #f0e8d8; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace;
  display: flex; justify-content: center; align-items: flex-start; overflow: hidden;
  -webkit-user-select: none; user-select: none; touch-action: manipulation;
}
#shell { display: flex; flex-direction: column; align-items: center; padding: 8px 8px 4px; gap: 8px; width: 100%; height: 100vh; height: 100dvh; }
#bezel {
  background: linear-gradient(#2a9a2a, #1e7a1e); border-radius: 12px 12px 40px 12px; padding: 6px 14px 14px;
  box-shadow: 0 5px 0 #125212, 0 8px 22px rgba(0,0,0,.35), inset 0 2px 0 rgba(255,255,255,.2);
}
.bz-top { display: flex; align-items: center; gap: 8px; height: 18px; font: bold 11px/1 ui-monospace, monospace; color: #f6e7b0; letter-spacing: 2px; }
.bz-top .led { width: 8px; height: 8px; border-radius: 50%; background: #ff4a5a; box-shadow: 0 0 6px #ff4a5a; }
.bz-c { margin-left: auto; color: #ffd36a; font-style: italic; }
#screen {
  position: relative; width: calc(var(--u) * 160); height: calc(var(--u) * 144); overflow: hidden; background: #000;
  border: 3px solid #0c3a10; border-radius: 4px; font: bold calc(var(--u) * 6.2)/1.35 ui-monospace, Menlo, Consolas, monospace; color: var(--ink);
}
#cv { width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
.layer { position: absolute; inset: 0; display: none; }
.layer.show { display: block; }
#fade { display: block; background: #000; opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 50; }
#fade.on { opacity: 1; }
#flash { display: block; background: #fff; opacity: 0; pointer-events: none; z-index: 49; }
#flash.on { opacity: 1; }
img.mon { display: block; }

/* Persian markup: script with transliteration underneath */
.fa { display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; margin: 0 .15em; line-height: 1.05; }
.fs { font-family: "Vazirmatn", "Noto Naskh Arabic", "Noto Sans Arabic", "Geeza Pro", Tahoma, "Segoe UI", sans-serif; font-weight: 700; font-size: 1.12em; color: #8a1c2c; unicode-bidi: isolate; }
.ft { font-size: .78em; color: #1d5a8a; font-weight: 700; }
.notr .ft { display: none; }
.en { display: block; }
.sm { font-size: .82em; color: #50586a; }
small { font-size: .8em; }

/* boxes: GBC text box with turquoise and gold Persian tile trim */
.box {
  position: absolute; background: var(--paper); color: var(--ink);
  border: calc(var(--u) * 1.4) solid var(--navy); border-radius: calc(var(--u) * 2);
  box-shadow: inset 0 0 0 calc(var(--u) * .7) var(--gold), inset 0 0 0 calc(var(--u) * 1.4) var(--paper), 0 calc(var(--u) * .8) 0 rgba(0,0,0,.35);
  padding: calc(var(--u) * 4) calc(var(--u) * 5);
  z-index: 20;
}
.box::before, .box::after { content: ""; position: absolute; width: calc(var(--u) * 3); height: calc(var(--u) * 3); background: var(--tq); transform: rotate(45deg); top: calc(var(--u) * -2.2); box-shadow: 0 0 0 calc(var(--u) * .6) var(--gold); }
.box::before { left: calc(var(--u) * 4); } .box::after { right: calc(var(--u) * 4); }
#textbox { left: calc(var(--u) * 2); right: calc(var(--u) * 2); bottom: calc(var(--u) * 2); min-height: calc(var(--u) * 44); display: none; z-index: 30; }
#textbox.show { display: block; }
.tb-body { min-height: calc(var(--u) * 33); }
.tb-arrow { position: absolute; right: calc(var(--u) * 5); bottom: calc(var(--u) * 2); opacity: 0; font-size: .8em; color: #8a1c2c; }
.tb-arrow.show { opacity: 1; animation: blink .7s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0; } }

/* menus */
.menu { display: grid; gap: calc(var(--u) * 1.5) calc(var(--u) * 6); z-index: 40; }
.mi { display: flex; gap: calc(var(--u) * 2); align-items: center; cursor: pointer; white-space: nowrap; }
.mi .cur { visibility: hidden; color: #8a1c2c; }
.mi.sel .cur { visibility: visible; }
.mi.dis { color: #a8a090; }
.startmenu { right: calc(var(--u) * 2); top: calc(var(--u) * 2); }
.yn { right: calc(var(--u) * 2); bottom: calc(var(--u) * 48); }
.bmenu { right: calc(var(--u) * 2); bottom: calc(var(--u) * 2); width: calc(var(--u) * 82); min-height: calc(var(--u) * 44); align-content: center; }
.titlemenu { left: 50%; transform: translateX(-50%); bottom: calc(var(--u) * 8); min-width: calc(var(--u) * 100); }
.opts, .sub, .teamsel { right: calc(var(--u) * 2); top: calc(var(--u) * 2); }
.team { left: calc(var(--u) * 2); right: calc(var(--u) * 2); top: calc(var(--u) * 2); max-height: calc(var(--u) * 140); overflow: hidden; gap: calc(var(--u) * 1); }
.team .mi { white-space: normal; }
.tm { display: flex; align-items: center; gap: calc(var(--u) * 3); line-height: 1.15; }
img.mon.tiny { width: calc(var(--u) * 16); height: calc(var(--u) * 16); }
.sub { z-index: 41; top: auto; bottom: calc(var(--u) * 2); }
.hpbar { display: inline-block; width: calc(var(--u) * 40); height: calc(var(--u) * 3); background: #4a4a58; border: calc(var(--u) * .6) solid var(--ink); border-radius: calc(var(--u) * 1); vertical-align: middle; overflow: hidden; }
.hpbar i { display: block; height: 100%; transition: width .4s; }

/* name entry */
.namebox { left: calc(var(--u) * 10); right: calc(var(--u) * 10); top: calc(var(--u) * 30); text-align: center; }
.namebox input, .qz-i input {
  font: inherit; width: 100%; padding: calc(var(--u) * 2); margin: calc(var(--u) * 3) 0; border: calc(var(--u) * .8) solid var(--navy);
  border-radius: calc(var(--u) * 1.5); background: #fff; color: var(--ink); text-align: center; text-transform: uppercase; outline: none;
}
.qz-i input { text-transform: none; margin: 0; text-align: left; }
button { font: inherit; cursor: pointer; }
.okbtn, .qz-i button { background: var(--tq); color: #fff; border: calc(var(--u) * .8) solid var(--navy); border-radius: calc(var(--u) * 1.5); padding: calc(var(--u) * 1.5) calc(var(--u) * 5); }

/* portrait and title */
#portrait { z-index: 15; background: radial-gradient(circle, #fff7e0 0, #f3dfb0 60%, #e0bf80 100%); }
#portrait img.big { width: calc(var(--u) * 64); height: calc(var(--u) * 64); margin: calc(var(--u) * 18) auto 0; }
.end { text-align: center; padding-top: calc(var(--u) * 26); color: var(--ink); }
.end-t { font-size: 2.2em; color: #8a1c2c; letter-spacing: .1em; margin-bottom: calc(var(--u) * 4); }
.end-s { margin-top: calc(var(--u) * 4); font-size: .85em; }
#title { z-index: 16; overflow: hidden; background: #1a2a5a; }
.tt-bg { position: absolute; inset: 0; opacity: .5;
  background:
    radial-gradient(circle at 50% 50%, transparent 0 calc(var(--u) * 4), #2ab0aa calc(var(--u) * 4) calc(var(--u) * 5), transparent calc(var(--u) * 5)) 0 0 / calc(var(--u) * 16) calc(var(--u) * 16),
    linear-gradient(45deg, transparent 46%, #e0b040 46% 54%, transparent 54%) 0 0 / calc(var(--u) * 16) calc(var(--u) * 16),
    linear-gradient(-45deg, transparent 46%, #e0b040 46% 54%, transparent 54%) 0 0 / calc(var(--u) * 16) calc(var(--u) * 16); }
.tt-logo { position: relative; text-align: center; margin-top: calc(var(--u) * 14); font-size: 2.6em; letter-spacing: .04em; color: #ffd860;
  text-shadow: calc(var(--u)*.8) 0 #8a1c2c, calc(var(--u)*-.8) 0 #8a1c2c, 0 calc(var(--u)*.8) #8a1c2c, 0 calc(var(--u)*-.8) #8a1c2c, calc(var(--u)*1.6) calc(var(--u)*1.6) #0b1a3a; }
.tt-sub { position: relative; text-align: center; color: #fbf6e8; margin-top: calc(var(--u) * 2); }
.tt-sub .fs { color: #ffd860; } .tt-sub .ft { color: #9fe8e0; }
.tt-mons { position: relative; display: flex; justify-content: center; gap: calc(var(--u) * 4); margin-top: calc(var(--u) * 6); }
.tt-mons img { width: calc(var(--u) * 36); height: calc(var(--u) * 36); animation: bob 1.2s ease-in-out infinite; }
.tt-mons img:nth-child(2) { animation-delay: .3s; } .tt-mons img:nth-child(3) { animation-delay: .6s; }
.tt-press { position: relative; text-align: center; color: #fff; margin-top: calc(var(--u) * 8); animation: blink 1s steps(2) infinite; }
.tt-ver { position: absolute; bottom: calc(var(--u) * 2); width: 100%; text-align: center; font-size: .7em; color: #9fb0d8; }
@keyframes bob { 50% { transform: translateY(calc(var(--u) * -3)); } }

/* battle */
#battle { z-index: 10; }
.b-bg { position: absolute; inset: 0; background:
  radial-gradient(ellipse calc(var(--u) * 34) calc(var(--u) * 7) at calc(var(--u) * 120) calc(var(--u) * 50), #a8d070 98%, transparent 100%),
  radial-gradient(ellipse calc(var(--u) * 38) calc(var(--u) * 8) at calc(var(--u) * 38) calc(var(--u) * 95), #a8d070 98%, transparent 100%),
  linear-gradient(#f8f0d8 0, #fdf8ec 60%, #f0e4c0 100%); }
.b-info { position: absolute; line-height: 1.2; }
.b-info.foe { left: calc(var(--u) * 5); top: calc(var(--u) * 5); width: calc(var(--u) * 80); border-left: calc(var(--u) * 1) solid var(--ink); border-bottom: calc(var(--u) * 1) solid var(--ink); padding: 0 0 calc(var(--u) * 1.5) calc(var(--u) * 3); border-bottom-left-radius: calc(var(--u) * 2); }
.b-info.me { right: calc(var(--u) * 4); top: calc(var(--u) * 60); width: calc(var(--u) * 80); border-right: calc(var(--u) * 1) solid var(--ink); border-bottom: calc(var(--u) * 1) solid var(--ink); padding: 0 calc(var(--u) * 3) calc(var(--u) * 1.5) 0; text-align: right; border-bottom-right-radius: calc(var(--u) * 2); }
.b-info .nm { font-size: .92em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.b-info .lv { font-size: .85em; } .b-info .lv small { color: #50586a; }
.b-info .hp { font-size: .75em; } .b-info .num { font-size: .85em; }
.b-info .hpbar { width: calc(var(--u) * 48); }
.b-spr { position: absolute; width: calc(var(--u) * 52); height: calc(var(--u) * 52); }
.b-spr img { width: 100%; height: 100%; }
.b-spr.foe { right: calc(var(--u) * 14); top: calc(var(--u) * 2); }
.b-spr.me { left: calc(var(--u) * 12); top: calc(var(--u) * 46); }

.b-spr img.foe { animation: bob 1.6s ease-in-out infinite; }
.b-spr img.trainer { width: 100%; height: 100%; }
.b-spr.hurt { animation: hurt .45s steps(2) 1; }
@keyframes hurt { 0%, 50% { opacity: 0; transform: translateX(calc(var(--u) * 3)); } 25%, 75% { opacity: 1; transform: translateX(calc(var(--u) * -3)); } }
.b-spr.faint { animation: faint .6s ease-in forwards; }
@keyframes faint { to { transform: translateY(calc(var(--u) * 30)); opacity: 0; } }
.b-spr.shake { animation: shake .5s ease-in-out 1; }
@keyframes shake { 25% { transform: rotate(-14deg); } 75% { transform: rotate(14deg); } }
.daftar-ico { width: 40%; height: 46%; margin: 34% auto 0; background: linear-gradient(90deg, #8a1c2c 0 18%, #c83038 18%); border: calc(var(--u) * .8) solid var(--ink); border-radius: calc(var(--u) * 1); box-shadow: inset calc(var(--u) * -2) 0 0 #f0d070; }

/* quiz */
#quiz { z-index: 35; }
.qz { left: calc(var(--u) * 2); right: calc(var(--u) * 2); bottom: calc(var(--u) * 2); top: calc(var(--u) * 30); display: flex; flex-direction: column; gap: calc(var(--u) * 2); font-size: calc(var(--u) * 5.4); padding: calc(var(--u) * 3) calc(var(--u) * 4); }
.qz-t { font-size: .8em; color: #8a1c2c; }
.qz-p { line-height: 1.25; }
.qz-p .who { color: #8a1c2c; }
.qz-o { display: grid; grid-template-columns: 1fr 1fr; gap: calc(var(--u) * 1.5); flex: 1; }
.qo { border: calc(var(--u) * .6) solid #b8ac90; border-radius: calc(var(--u) * 1.5); background: #fff; padding: calc(var(--u) * 1) calc(var(--u) * 1.5); display: flex; align-items: center; gap: calc(var(--u) * 1.5); font-size: .92em; line-height: 1.15; overflow: hidden; }
.qo .fa { align-items: flex-start; margin: 0; flex: none; }
.qo .fs, .qo .ft { white-space: nowrap; }
.qz-o.one { grid-template-columns: 1fr; }
.qz-o.one .qo { padding-top: calc(var(--u) * .6); padding-bottom: calc(var(--u) * .6); }
.qz-o.one .qo .en.sm { margin-left: auto; text-align: right; font-size: .78em; line-height: 1.1; }
.qo .ql { flex: none; width: calc(var(--u) * 6); height: calc(var(--u) * 6); border-radius: 50%; background: var(--navy); color: #fff; display: grid; place-items: center; font-size: .75em; }
.qo.right { background: #c8f0c0; border-color: #2a8a3a; }
.qo.wrong { background: #f8c8c8; border-color: #b02030; }
.qz-i { display: flex; gap: calc(var(--u) * 2); }
.qz-i input { flex: 1; padding: calc(var(--u) * 1.5) calc(var(--u) * 2); }

/* lenguadex */
.dex { z-index: 25; }
.dx { inset: calc(var(--u) * 2); display: flex; flex-direction: column; gap: calc(var(--u) * 2); font-size: calc(var(--u) * 5.4); padding: calc(var(--u) * 3) calc(var(--u) * 4); }
.dx-h { display: flex; justify-content: space-between; color: #8a1c2c; }
.dx-h span { color: var(--ink); font-size: .85em; }
.dx-d { display: flex; gap: calc(var(--u) * 3); align-items: center; min-height: calc(var(--u) * 36); border-bottom: calc(var(--u) * .6) dashed #b8ac90; padding-bottom: calc(var(--u) * 2); line-height: 1.25; }
.dx-d img.mon { width: calc(var(--u) * 36); height: calc(var(--u) * 36); flex: none; }
.dx-q { width: calc(var(--u) * 36); height: calc(var(--u) * 36); display: grid; place-items: center; font-size: 2em; color: #b8ac90; flex: none; }
.dx-l { flex: 1; }
.dx-r { line-height: 1.22; white-space: pre; overflow: hidden; text-overflow: ellipsis; }
.dx-r .cur { visibility: hidden; color: #8a1c2c; } .dx-r.sel .cur { visibility: visible; }
.dx-f { font-size: .72em; color: #6a6a78; }

/* controls */
#pad { --c: clamp(44px, 15vw, 72px); --ab: clamp(58px, 21vw, 92px); flex: 1; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; width: min(100%, 560px); padding: 0 6px 10px; }
.dpad { display: grid; grid-template-columns: repeat(3, var(--c)); grid-template-rows: repeat(3, var(--c)); justify-self: start; }
.dp { background: #222232; border: 0; border-radius: 6px; box-shadow: 0 3px 0 #0a0a12; touch-action: none; }
.dp.up { grid-area: 1/2; } .dp.left { grid-area: 2/1; } .dp.mid { grid-area: 2/2; background: #222232; border-radius: 0; } .dp.right { grid-area: 2/3; } .dp.down { grid-area: 3/2; }
.dp.on, .rb.on, .pill.on { filter: brightness(1.6); transform: translateY(2px); box-shadow: none; }
.ss { display: flex; gap: 10px; }
.pill { background: #1a3a1c; color: #d8f0d0; border: 0; border-radius: 20px; padding: 6px 14px; font-size: 11px; letter-spacing: 1px; box-shadow: 0 3px 0 #15121f; touch-action: none; }
.ab { display: flex; gap: 14px; justify-self: end; transform: rotate(-18deg); }
.rb { width: var(--ab); height: var(--ab); border-radius: 50%; border: 0; background: #b0283a; color: #ffd8dc; font: bold 18px ui-monospace, monospace; box-shadow: 0 4px 0 #5a0c18; touch-action: none; }
.rb.b { margin-top: calc(var(--ab) * .45); }
#keys { font-size: 11px; color: #cfe8c8; text-align: center; }
@media (pointer: coarse) { #keys { display: none; } }

@media (max-width: 600px) {
  #shell { padding: 4px 4px 0; gap: 6px; }
  #bezel { padding: 4px 4px 8px; border-radius: 10px 10px 28px 10px; width: 100%; display: flex; flex-direction: column; align-items: center; }
  .bz-top { align-self: stretch; padding: 0 4px; }
  .pill { padding: 10px 22px; font-size: 13px; }
  #pad { --c: clamp(44px, 14vw, 70px); --ab: clamp(58px, 19vw, 86px); grid-template-columns: auto 1fr auto; grid-template-rows: 1fr auto; padding: 4px 12px 10px; row-gap: 6px; }
  .dpad { grid-row: 1; grid-column: 1; }
  .ab { grid-row: 1; grid-column: 3; }
  .ss { grid-row: 2; grid-column: 1 / 4; justify-content: center; }
}
.b-info .lv .fs { font-size: 1em; margin-left: .3em; }
#b-foe.hidename .nm, #b-foe.hidename .lv .fs { visibility: hidden; }
#b-foe.hidename .nm { visibility: visible; color: transparent; text-shadow: 0 0 calc(var(--u) * 2) #1c2234; }
#battle.lair .b-bg { background:
  radial-gradient(ellipse calc(var(--u) * 34) calc(var(--u) * 7) at calc(var(--u) * 120) calc(var(--u) * 50), #3a3a48 98%, transparent 100%),
  radial-gradient(ellipse calc(var(--u) * 38) calc(var(--u) * 8) at calc(var(--u) * 38) calc(var(--u) * 95), #3a3a48 98%, transparent 100%),
  linear-gradient(90deg, transparent 0 calc(var(--u) * 6), #1e4a58 calc(var(--u) * 6) calc(var(--u) * 30), transparent calc(var(--u) * 30)) 0 calc(var(--u) * 10) / 100% calc(var(--u) * 16) no-repeat,
  linear-gradient(#141420, #22222e 70%, #2a2a36); }
#battle.lair .b-info { color: #f0e8f0; border-color: #c8c0d0; }
#battle.lair .b-info .lv small { color: #b8b0c8; }

</style>
</head>
<body>
<div id="shell">
  <div id="bezel">
    <div class="bz-top"><span class="led"></span><span class="bz-t">LENGUAMON</span><span class="bz-c">COLOR</span></div>
    <div id="screen">
      <canvas id="cv" width="160" height="144"></canvas>
      <div id="battle" class="layer">
        <div class="b-bg"></div>
        <div id="b-foe" class="b-info foe"></div><div id="b-foe-spr" class="b-spr foe"></div>
        <div id="b-me-spr" class="b-spr me"></div><div id="b-me" class="b-info me"></div>
      </div>
      <div id="portrait" class="layer"></div>
      <div id="title" class="layer"></div>
      <div id="quiz" class="layer"></div>
      <div id="textbox" class="box"><div class="tb-body"></div><div class="tb-arrow">▼</div></div>
      <div id="flash" class="layer"></div>
      <div id="fade" class="layer"></div>
    </div>
  </div>
  <div id="pad">
    <div class="dpad">
      <button data-btn="up" class="dp up" aria-label="up"></button><button data-btn="left" class="dp left" aria-label="left"></button>
      <span class="dp mid"></span>
      <button data-btn="right" class="dp right" aria-label="right"></button><button data-btn="down" class="dp down" aria-label="down"></button>
    </div>
    <div class="ss"><button data-btn="start" class="pill">START</button></div>
    <div class="ab"><button data-btn="b" class="rb b">B</button><button data-btn="a" class="rb a">A</button></div>
  </div>
  <div id="keys">Arrows / WASD: move · Z, Space, Enter: A · X, Esc: B · M or Shift: START (menu)</div>
</div>
<script>
'use strict';
// LENGUAMON word bank (Persian v1)
// Format: transliteration | english | persian script | route (1-3) | type
// Alternatives are separated by " / ". In the script column "+" is a zero-width non-joiner.
// Sources: Kurt's "Farsi word bank.csv" (ICF course weeks 1-11, Quizlet, Instagram lists),
// plus high-frequency conversational words checked against the wordfreq Persian top-1000 list
// and beginner phrase lists (MSU Open Books "Common Words and Phrases", Omniglot Persian phrases).
const RAW_WORDS = `
salam|hello|سلام|1|GREET
khodahafez|goodbye|خداحافظ|1|GREET
khubi? / chetori?|how are you?|خوبی؟ / چطوری؟|1|GREET
halet chetore?|how are you doing?|حالت چطوره؟|1|GREET
khubam|I'm good|خوبم|1|GREET
kheyli khubam|I'm very good|خیلی خوبم|1|GREET
khub nistam|I'm not good|خوب نیستم|1|GREET
bad nistam|not bad|بد نیستم|1|GREET
merci|thanks|مرسی|1|GREET
mamnoon|thank you|ممنون|1|GREET
khahesh mikonam|you're welcome|خواهش می+کنم|1|GREET
a'li|great / excellent|عالی|1|GREET
khoshbakhtam|nice to meet you|خوشبختم|1|GREET

const W = w => F(w.fa, splitAlts(w.tr)[0]);
const B = s => `<b>${esc(s)}</b>`;
const nm = () => esc(S ? S.name : '');

function speedMs() { return [8, 22, 40][OPTS.speed] ?? 22; }

// typewriter that reveals plain text char by char and Persian blocks whole
function typeInto(el, html) {
  el.innerHTML = html;
  const units = [];
  (function walk(n) {
    for (const ch of [...n.childNodes]) {
      if (ch.nodeType === 3) { units.push({ t: ch, s: ch.textContent }); ch.textContent = ''; }
      else if (ch.classList && ch.classList.contains('fa')) { ch.style.visibility = 'hidden'; units.push({ e: ch }); }
      else if (ch.tagName === 'IMG') { ch.style.visibility = 'hidden'; units.push({ e: ch }); }
      else walk(ch);
    }
  })(el);
  let ui = 0, ci = 0, done = false, timer = null, n = 0;
  const finish = () => { for (const u of units) { if (u.t) u.t.textContent = u.s; else u.e.style.visibility = 'visible'; } done = true; clearInterval(timer); };
  const p = new Promise(res => {
    const tick = () => {
      if (done) { res(); return; }
      const u = units[ui]; if (!u) { finish(); res(); return; }
      if (u.e) { u.e.style.visibility = 'visible'; ui++; SND.fx('blip'); return; }
      ci++; u.t.textContent = u.s.slice(0, ci); if (++n % 3 === 0) SND.fx('blip');
      if (ci >= u.s.length) { ui++; ci = 0; }
    };
    timer = setInterval(() => { tick(); if (done) { clearInterval(timer); res(); } }, speedMs());
  });
  return { p, skip: () => { if (!done) { finish(); } }, isDone: () => done };
}

const TB = () => $('#textbox');
// say(pages): each page is html. Resolves after the last page is acknowledged.
// opts.keep: leave last page visible (for a question + menu)
async function say(pages, opts = {}) {
  if (!Array.isArray(pages)) pages = [pages];
  const box = TB(), body = box.querySelector('.tb-body'), arrow = box.querySelector('.tb-arrow');
  box.classList.add('show');
  for (let i = 0; i < pages.length; i++) {
    arrow.classList.remove('show');
    const tw = typeInto(body, pages[i]);
    const last = i === pages.length - 1;
    await new Promise(res => {
      let ready = false;
      const h = b => {
        if (b !== 'a' && b !== 'b') return;
        if (!tw.isDone()) { tw.skip(); return; }
        if (ready) { popH(h); SND.fx('blip'); res(); }
      };
      pushH(h);
      const waitDone = setInterval(() => {
        if (tw.isDone()) {
          clearInterval(waitDone); ready = true;
          if (last && opts.keep) { popH(h); res(); return; }
          arrow.classList.add('show');
          if (opts.auto) setTimeout(() => { if (handlers.includes(h)) { popH(h); res(); } }, opts.auto);
        }
      }, 16);
    });
  }
  arrow.classList.remove('show');
  if (!opts.keep) box.classList.remove('show');
}
function hideText() { TB().classList.remove('show'); }

// generic vertical/2-column menu. items: strings or {html, disabled}
function choose(items, opts = {}) {
  return new Promise(res => {
    const el = document.createElement('div');
    el.className = 'box menu ' + (opts.cls || '');
    Object.assign(el.style, opts.style || {});
    const cols = opts.cols || 1;
    el.style.gridTemplateColumns = `repeat(${cols}, auto)`;
    const rows = items.map((it, i) => {
      const d = document.createElement('div'); d.className = 'mi' + (it.disabled ? ' dis' : '');
      d.innerHTML = `<span class="cur">▶</span><span>${typeof it === 'string' ? esc(it) : it.html}</span>`;
      d.addEventListener('pointerdown', e => { e.stopPropagation(); if (it.disabled) return; idx = i; draw(); finish(i); });
      el.appendChild(d); return d;
    });
    (opts.parent || $('#screen')).appendChild(el);
    let idx = opts.start || 0;
    const draw = () => rows.forEach((r, i) => r.classList.toggle('sel', i === idx));
    draw();
    const finish = v => { popH(h); el.remove(); res(v); };
    const h = b => {
      const n = items.length;
      if (b === 'up') idx = (idx - cols + n) % n; else if (b === 'down') idx = (idx + cols) % n;
      else if (b === 'left' && cols > 1) idx = (idx - 1 + n) % n; else if (b === 'right' && cols > 1) idx = (idx + 1) % n;
      else if (b === 'a') { if (items[idx].disabled) { SND.fx('bump'); return; } SND.fx('select'); finish(idx); return; }
      else if ((b === 'b' || (b === 'start' && opts.startCloses)) && opts.cancel !== false) { SND.fx('cancel'); finish(-1); return; }
      else return;
      SND.fx('blip'); draw();
      if (opts.onMove) opts.onMove(idx);
    };
    pushH(h);
  });
}
async function ask(q, yes = 'YES', no = 'NO') {
  await say(q, { keep: true });
  const r = await choose([yes, no], { cls: 'yn' });
  hideText();
  return r === 0;
}
function fade(on, ms = 250) { const f = $('#fade'); f.style.transitionDuration = ms + 'ms'; f.classList.toggle('on', on); return sleep(ms); }
async function flash(n = 3) { const f = $('#flash'); for (let i = 0; i < n; i++) { f.classList.add('on'); await sleep(70); f.classList.remove('on'); await sleep(70); } }
function waitA() { return new Promise(res => { const h = b => { if (b === 'a' || b === 'b' || b === 'start') { popH(h); res(b); } }; pushH(h); }); }

// text input inside the screen (name entry); resolves with the string
function textInput(label, max = 10) {
  return new Promise(res => {
    const el = document.createElement('div'); el.className = 'box namebox';
    el.innerHTML = `<div class="nb-l">${label}</div><input maxlength="${max}" autocomplete="off" autocapitalize="characters" spellcheck="false"><div class="btnrow"><button class="okbtn">OK</button></div>`;
    $('#screen').appendChild(el);
    const inp = el.querySelector('input'); setTimeout(() => inp.focus(), 50);
    const block = () => { }; pushH(block);
    const done = () => { const v = inp.value.trim().toUpperCase().replace(/[^A-Z0-9 \-]/g, ''); if (!v) { inp.focus(); return; } SND.fx('select'); popH(block); el.remove(); res(v); };
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); done(); } e.stopPropagation(); });
    el.querySelector('.okbtn').addEventListener('click', done);
  });
}

const MAPS = {};
const NPC_POS = {}; // marker -> {map,x,y}
function buildMaps() {
  for (const [id, src] of Object.entries(MAP_SRC)) {
    const grid = src.rows.map(r => r.split(''));
    const m = { ...src, id, w: grid[0].length, h: grid.length, grid, signs: [], doors: {} };
    let si = 0;
    for (let y = 0; y < m.h; y++) for (let x = 0; x < m.w; x++) {
      const ch = grid[y][x];
      if (src.bases && src.bases[ch]) { NPC_POS[ch] = { map: id, x, y }; grid[y][x] = src.bases[ch]; }
      else if (ch === 'S') { m.signs.push({ x, y, text: (src.signs || [])[si++] || '' }); }
      else if (src.doors && src.doors[ch]) { m.doors[ch] = { x, y, ...src.doors[ch] }; }
    }
    m.canvas = renderMap(m);
    MAPS[id] = m;
  }
}
function regionOf(map, y) { if (map !== 'world') return 0; if (y >= 63 || y <= 12) return 0; if (y >= 48) return 1; if (y >= 26) return 2; return 3; }

// ---- NPCs ----
const NPCS = [];
function npc(marker, def) { NPCS.push({ marker, dir: 'down', ...def }); }
function npcPos(n) { const p = NPC_POS[n.marker]; if (!p) return null; const o = n.where ? n.where() : null; return o ? { map: p.map, x: o[0], y: o[1] } : p; }
function npcAt(map, x, y) { for (const n of NPCS) { if (n.hidden && n.hidden()) continue; const p = npcPos(n); if (p && p.map === map && p.x === x && p.y === y) return n; } return null; }

// ---- player & world state ----
const PL = { x: 0, y: 0, dir: 'down', moving: false, t0: 0, fx: 0, fy: 0, step: 0, walkPh: 0 };
const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
const MOVE_MS = 170;
let curMap = null, worldBusy = false, encounterCooldown = 0;
const cv = () => $('#cv');
function solidAt(m, x, y) {
  if (x < 0 || y < 0 || x >= m.w || y >= m.h) return true;
  const t = TILE[m.grid[y][x]]; if (!t || t.solid) return true;
  if (npcAt(m.id, x, y)) return true;
  return false;
}
function placePlayer(map, x, y, dir) { S.map = map; S.x = x; S.y = y; S.dir = dir || S.dir; curMap = MAPS[map]; PL.x = x; PL.y = y; PL.dir = S.dir; PL.moving = false; musicForPlace(); }
function musicForPlace() { const r = regionOf(S.map, S.y); SND.music(r === 0 ? 'town' : 'route'); }

function drawWorld() {
  const c = cv().getContext('2d'); c.imageSmoothingEnabled = false;
  R(c, 0, 0, 160, 144, '#101018');
  if (!curMap) return;
  let px = PL.x * TS, py = PL.y * TS;
  if (PL.moving) { const k = clamp((performance.now() - PL.t0) / MOVE_MS, 0, 1); const [dx, dy] = DIRS[PL.dir]; px = (PL.x - dx * (1 - k)) * TS; py = (PL.y - dy * (1 - k)) * TS; }
  const mw = curMap.w * TS, mh = curMap.h * TS;
  let cx = px - 72, cy = py - 64;
  cx = mw <= 160 ? (mw - 160) / 2 : clamp(cx, 0, mw - 160);
  cy = mh <= 144 ? (mh - 144) / 2 : clamp(cy, 0, mh - 144);
  cx = Math.round(cx); cy = Math.round(cy);
  c.drawImage(curMap.canvas, -cx, -cy);
  const ents = [];
  for (const n of NPCS) { if (n.hidden && n.hidden()) continue; const p = npcPos(n); if (p && p.map === curMap.id) ents.push({ y: p.y * TS, draw: () => drawChar(c, p.x * TS - cx, p.y * TS - cy - 2, LOOKS[n.look], n.dir, 0) }); }
  let step = 0; if (PL.moving) { const k = (performance.now() - PL.t0) / MOVE_MS; step = k < 0.5 ? (PL.walkPh ? 1 : 2) : 0; }
  ents.push({ y: py, draw: () => drawChar(c, Math.round(px - cx), Math.round(py - cy - 2), LOOKS.player, PL.dir, step) });
  ents.sort((a, b) => a.y - b.y).forEach(e => e.draw());
  // tall grass over feet
  const t = curMap.grid[PL.y] && curMap.grid[PL.y][PL.x];
  if (t === ':' && !PL.moving) { c.save(); c.beginPath(); c.rect(px - cx, py - cy + 10, 16, 6); c.clip(); c.drawImage(curMap.canvas, -cx, -cy); c.restore(); }
}
let rafOn = false;
function loop() {
  if (worldActive()) tickWorld();
  if (!$('#battle').classList.contains('show') && !$('#title').classList.contains('show')) drawWorld();
  requestAnimationFrame(loop);
}
function worldActive() { return handlers[handlers.length - 1] === worldH && !worldBusy; }
function tickWorld() {
  const now = performance.now();
  if (PL.moving) {
    if (now - PL.t0 >= MOVE_MS) { PL.moving = false; onStep(); }
    else return;
  }
  if (!worldActive()) return;
  for (const d of ['up', 'down', 'left', 'right']) {
    if (!held[d]) continue;
    PL.dir = d; S.dir = d;
    const [dx, dy] = DIRS[d], nx = PL.x + dx, ny = PL.y + dy;
    if (solidAt(curMap, nx, ny)) { if (now - (PL.lastBump || 0) > 350) { SND.fx('bump'); PL.lastBump = now; } return; }
    PL.x = nx; PL.y = ny; S.x = nx; S.y = ny; PL.moving = true; PL.t0 = now; PL.walkPh ^= 1;
    return;
  }
}
async function onStep() {
  const ch = curMap.grid[PL.y][PL.x];
  // doors
  const door = Object.values(curMap.doors || {}).find(d => d.x === PL.x && d.y === PL.y);
  if (door) { await run(() => warp(door.to, door.tx, door.ty, 'up')); return; }
  if (TILE[ch] && TILE[ch].exit && curMap.exit) { const d = MAPS.world.doors[curMap.exit.door]; await run(() => warp('world', d.x, d.y + 1, 'down')); return; }
  // region change music
  musicForPlace();
  // guard / scripted tiles
  if (TILE[ch] && TILE[ch].enc) {
    if (encounterCooldown > 0) { encounterCooldown--; return; }
    if (rand() < 0.13) { await run(() => wildEncounter(regionOf('world', PL.y))); encounterCooldown = 2; }
  }
}
async function warp(to, x, y, dir) {
  SND.fx('door'); await fade(true, 180);
  placePlayer(to, x, y, dir); writeSave(); drawWorld();
  await fade(false, 180);
}
// run a script while the world is paused
async function run(fn) { worldBusy = true; try { await fn(); } finally { worldBusy = false; } }

function worldH(b) {
  if (worldBusy || PL.moving) return;
  if (b === 'a') run(interact);
  else if (b === 'start') run(startMenu);
}
async function interact() {
  const [dx, dy] = DIRS[PL.dir];
  let tx = PL.x + dx, ty = PL.y + dy;
  const t = curMap.grid[ty] && TILE[curMap.grid[ty][tx]];
  if (t && t.counter) { tx += dx; ty += dy; }
  const n = npcAt(curMap.id, tx, ty);
  if (n) { const back = { up: 'down', down: 'up', left: 'right', right: 'left' }; const od = n.dir; n.dir = back[PL.dir]; await n.talk(n); if (!n.fixed) n.dir = n.keepDir ? od : n.dir; writeSave(); return; }
  const sg = (curMap.signs || []).find(s => s.x === tx && s.y === ty);
  if (sg) { await say(sg.text); return; }
}

async function startMenu() {
  SND.fx('select');
  let idx = 0;
  while (true) {
    const items = [
      { html: 'LENGUADEX', disabled: !S.flags.starter }, { html: 'LENGUAMON', disabled: !S.team.length }, 'DAFTAR', { html: esc(S.name) }, 'SAVE', 'OPTIONS', 'EXIT'];
    const r = await choose(items, { cls: 'startmenu', start: idx, startCloses: true });
    if (r < 0 || r === 6) return;
    idx = r;
    if (r === 0) await dexScreen();
    else if (r === 1) await teamScreen(false);
    else if (r === 2) await say([`DAFTAR ${F('دفتر', 'daftar')} = notebook.<br>You have ${B('x' + S.daftar)}.`, 'In battle, write a weakened wild Lenguamon into your DAFTAR by typing its Persian word. Weaker words are easier to catch!']);
    else if (r === 3) await say([`${B(S.name)}<br>KASHI BADGES: ${['b1', 'b2', 'b3'].map(b => S.flags[b] ? '◆' : '◇').join(' ')}<br>LENGUADEX: ${caughtCount()} / ${WORDS.length}`, `Route 1: ${caughtInRoute(1)}/${wordsOfRoute(1).length} · Route 2: ${caughtInRoute(2)}/${wordsOfRoute(2).length} · Route 3: ${caughtInRoute(3)}/${wordsOfRoute(3).length}<br>Save fades in about ${hoursLeft(S)}h if you stop playing.`]);
    else if (r === 4) { writeSave(); SND.fx('good'); await say([`${esc(S.name)} saved the game!`, 'Your save stays alive as long as you play at least once every 48 hours.']); }
    else if (r === 5) await optionsScreen();
  }
}
async function optionsScreen() {
  let idx = 0;
  while (true) {
    const items = [
      `TRANSLITERATION: ${OPTS.translit ? 'ON' : 'OFF'}`, `MUSIC: ${OPTS.music ? 'ON' : 'OFF'}`, `SOUND FX: ${OPTS.sfx ? 'ON' : 'OFF'}`, `TEXT SPEED: ${['FAST', 'MID', 'SLOW'][OPTS.speed]}`, 'BACK'];
    const r = await choose(items, { cls: 'opts', start: idx });
    if (r < 0 || r === 4) return; idx = r;
    if (r === 0) OPTS.translit = !OPTS.translit;
    if (r === 1) { OPTS.music = !OPTS.music; SND.refresh(); }
    if (r === 2) OPTS.sfx = !OPTS.sfx;

}
function dexEntryHtml(w) {
  const caught = S.caught[w.key], seen = S.seen[w.key];
  if (!seen && !caught) return `<div class="dx-d"><div class="dx-q">?</div><div><b>-----</b><br>Not seen yet.<br><small>${ROUTE_NAMES[w.route]}</small></div></div>`;
  const st = S.stats[w.key] || [0, 0];

async function dexScreen() {

        if (S.team.some(m => m.key === w.key)) { await say(`${esc(w.name)} is already on your team.`); return; }
        if (S.team.length < 6) { S.team.push(makeMon(w)); SND.fx('good'); await say(`${esc(w.name)} joined your team!`); }

// ===== LENGUAMON battles: typed quizzes, catching, conversation bosses =====
function stat(w, ok) { const s = S.stats[w.key] || (S.stats[w.key] = [0, 0]); s[ok ? 0 : 1]++; }

// build a 4-option question. dir: 'en2fa' (type the Persian) or 'fa2en' (type the English)
function makeQuestion(w, dir) {
  const field = dir === 'en2fa' ? 'trForms' : 'enForms';
  const overlaps = (a, b) => a[field].some(f => b[field].includes(f)) || a.key === b.key;
  const tiers = [WORDS.filter(x => x.route === w.route && x.type === w.type), WORDS.filter(x => x.route === w.route), WORDS];
  const picks = [];
  for (const tier of tiers) {
    for (const x of shuffle(tier)) {
      if (picks.length >= 3) break;
      if (overlaps(x, w) || picks.some(p => overlaps(p, x))) continue;
      // prefer distractors of similar length so long phrases are not giveaways
      if (tier !== WORDS && Math.abs(x.tr0.length - w.tr0.length) > 14 && rand() < 0.7) continue;
      picks.push(x);
    }
    if (picks.length >= 3) break;
  }
  const opts = shuffle([w, ...picks]).map(x => ({
    word: x, correct: x === w, forms: x[field],
    html: dir === 'en2fa' ? W(x) : `<span class="en">${esc(x.en0)}</span>`,
  }));
  const prompt = dir === 'en2fa'
    ? `How do you say <b>"${esc(w.en0)}"</b> in Persian?`
    : `What does ${W(w)} mean?`;
  return { w, dir, prompt, opts, answerHtml: `${W(w)} = <b>${esc(w.en0)}</b>`, hint: dir === 'en2fa' ? 'Type the Persian (Latin letters)' : 'Type the English' };
}
// grade typed text against the options: nearest option wins, within a typo tolerance
function grade(q, typed) {
  const t = norm(typed); if (!t) return null;
  let best = null, bestD = 1e9, correctD = 1e9;
  for (const o of q.opts) { for (const f of o.forms) { const d = lev(t, f); if (d < bestD) { bestD = d; best = o; } if (o.correct && d < correctD) correctD = d; } }
  const cf = q.opts.find(o => o.correct).forms.reduce((a, f) => lev(t, f) <= lev(t, a) ? f : a);
  const ok = best && best.correct && correctD <= tolFor(cf.length);
  return { ok, chosen: best, exact: correctD === 0 };
}
// show the quiz panel; resolves {ok, ms, chosen}
function quiz(q, title, o = {}) {
  return new Promise(res => {
    const el = $('#quiz');
    $('#b-foe').classList.toggle('hidename', !!o.hideFoe);
    el.innerHTML = `<div class="box qz"><div class="qz-t">${title || ''}</div><div class="qz-p">${q.prompt}</div>
      <div class="qz-o${q.opts.some(o => (o.word.tr0 || '').length > 15 || (o.word.en0 || '').length > 20) || q.boss ? ' one' : ''}">${q.opts.map((o, i) => `<div class="qo" data-i="${i}"><span class="ql">${'ABCD'[i]}</span>${o.html}</div>`).join('')}</div>
      <form class="qz-i"><input autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="${q.hint}"><button>ENTER</button></form></div>`;
    el.classList.add('show'); window.__q = q;
    const inp = el.querySelector('input'); const t0 = performance.now();
    inp.disabled = true; setTimeout(() => { inp.disabled = false; inp.value = ''; inp.focus(); }, 300); // ignore leftover A-button presses
    const block = () => { }; pushH(block);
    let done = false;
    el.querySelector('form').addEventListener('submit', async e => {
      e.preventDefault(); if (done) return;
      const g = grade(q, inp.value); if (!g) { inp.focus(); return; }
      done = true; inp.blur();
      const ci = q.opts.findIndex(o => o.correct), chi = q.opts.indexOf(g.chosen);
      el.querySelectorAll('.qo')[ci].classList.add('right');
      if (!g.ok && chi >= 0 && chi !== ci) el.querySelectorAll('.qo')[chi].classList.add('wrong');
      SND.fx(g.ok ? 'good' : 'bad');
      await sleep(g.ok ? 700 : 1300);
      el.classList.remove('show'); el.innerHTML = ''; popH(block); $('#b-foe').classList.remove('hidename');
      res({ ok: g.ok, ms: performance.now() - t0, chosen: g.chosen });
    });
    inp.addEventListener('keydown', e => e.stopPropagation());
  });
}

const BT = { foe: null, me: null, boss: null };
function bShow(on) { $('#battle').classList.toggle('show', on); }
function bDraw() {
  const f = BT.foe, m = BT.me;
  const fw = f.w, mw = m ? monW(m) : null;
  $('#b-foe').innerHTML = BT.boss
    ? `<div class="nm">${esc(BT.boss.name)}</div><div class="lv">TALK ${BT.boss.left}/${BT.boss.total}</div><div class="hp">${hpBar({ hp: BT.boss.left }, BT.boss.total)}</div>`
    : `<div class="nm">${esc(fw.name)}</div><div class="lv">:L${f.lvl} <small>${TYPES[fw.type].label}</small> <span class="fs" dir="rtl">${esc(speciesOf(fw).fa)}</span></div><div class="hp">HP ${hpBar(f, f.max)}</div>`;
  $('#b-foe-spr').innerHTML = BT.boss ? `<img class="mon trainer" src="${portraitUrl(BT.boss.look)}">` : monImg(fw, 'foe');
  if (m) {
    $('#b-me').innerHTML = `<div class="nm">${esc(mw.name)}</div><div class="lv">:L${m.lvl}</div><div class="hp">HP ${hpBar(m, maxHp(m.lvl))}</div><div class="num">${m.hp}/ ${maxHp(m.lvl)}</div>`;
    $('#b-me-spr').innerHTML = monImg(mw, 'me');

}
async function anim(sel, cls, ms = 400) { const e = $(sel); if (!e) return; e.classList.remove(cls); void e.offsetWidth; e.classList.add(cls); await sleep(ms); e.classList.remove(cls); }
const dmgRoll = base => Math.max(1, Math.round(base * (0.85 + rand() * 0.3)));

function chooseWild(route) {
  const pool = wordsOfRoute(route);
  const top = Math.max(...S.team.map(m => m.lvl), 5);
  let elig = pool.filter(w => w.level <= top + 6);
  if (elig.length < 10) elig = pool.slice().sort((a, b) => a.level - b.level).slice(0, 10);
  const weights = elig.map(w => (S.caught[w.key] ? 1 : S.seen[w.key] ? 3 : 4));
  let t = rand() * weights.reduce((a, b) => a + b, 0);
  for (let i = 0; i < elig.length; i++) { t -= weights[i]; if (t <= 0) return elig[i]; }
  return elig[0];
}
function reviewWord(except) {
  const pool = WORDS.filter(w => (S.seen[w.key] || S.caught[w.key]) && w.key !== except.key);
  if (pool.length < 4) return null;
  const scored = pool.map(w => { const s = S.stats[w.key] || [0, 0]; return { w, s: s[1] * 2 - s[0] + rand() * 3 }; }).sort((a, b) => b.s - a.s);
  return scored[Math.floor(rand() * Math.min(6, scored.length))].w;
}

async function gainXp(m, amt) {
  const w = monW(m); m.xp += amt;

    SND.fx('levelup'); bDraw(); await say(`${esc(w.name)} grew to level ${m.lvl}!`);

}
// returns true if the player still has a Lenguamon standing
async function handleFaint() {
  const w = monW(BT.me); SND.fx('faint'); await anim('#b-me-spr', 'faint', 600);
  await say(`${esc(w.name)} ran out of words!`);
  if (!teamAlive()) return false;
  await say('Choose your next Lenguamon.');

  BT.me = S.team[r]; bDraw(); await say(`Go! ${esc(monW(BT.me).name)}!`); return true;
}
async function blackout() {
  await say([`${esc(S.name)} has no Lenguamon left to talk with!`, `${esc(S.name)} hurried back to Agha Reza's teahouse...`]);
  await fade(true, 300); bShow(false); BT.boss = null;
  healTeam(); placePlayer('teahouse', 5, 4, 'up'); writeSave(); drawWorld(); await fade(false, 300);
  await say([`AGHA REZA: ${F('خسته نباشی', 'khasteh nabashi')}! Sit, have some chai.`, 'Your Lenguamon are rested and ready. Words take practice. Try again!']);
}
// the enemy's turn. lastQ = the question the player just answered (or null)
async function foeTurn(lastOk, lastQ) {
  const f = BT.foe, m = BT.me, fw = f.w;
  const name = BT.boss ? BT.boss.name : `Wild ${fw.name}`;
  let hit = lastOk ? rand() < (BT.boss ? 0.25 : 0.35) : true;
  let move = lastQ && !lastOk ? lastQ.answerHtml : BT.boss ? 'a rapid-fire question' : W(fw);
  await say(`${esc(name)} used ${move}!`);
  if (!hit) { SND.fx('miss'); await say(`${esc(name)}'s attack missed!`); return true; }
  const dmg = dmgRoll(BT.boss ? (3 + BT.boss.lvl * 0.5) * (lastOk ? 0.5 : 1) : (3 + f.lvl * 0.7) * (lastOk ? 0.7 : 1));
  SND.fx('hit'); await anim('#b-me-spr', 'hurt', 450);
  m.hp = Math.max(0, m.hp - dmg); bDraw();
  if (m.hp <= 0) return handleFaint();
  return true;
}

async function wildEncounter(route) {
  if (!S.team.length) return;
  const w = chooseWild(route);
  const firstTime = !S.seen[w.key] && !S.caught[w.key];
  S.seen[w.key] = true;
  BT.foe = { w, lvl: w.level, max: maxHp(w.level), hp: maxHp(w.level) }; BT.me = lead(); BT.boss = null;
  await battleIntro('battle');
  await say(`A wild ${B(w.name)} appeared!`);
  await say(`Go! ${B(monW(BT.me).name)}! Show what you know!`);
  let menuIdx = 0, first = true;
  while (true) {
    bDraw();
    let r = 0;
    if (!first) {
      await say(`What will ${esc(monW(BT.me).name)} do?`, { keep: true });
      r = await choose(['FIGHT', `DAFTAR x${S.daftar}`, 'TEAM', 'RUN'], { cols: 2, cls: 'bmenu', cancel: false, start: menuIdx });
      hideText(); menuIdx = r;
    }
    if (r === 0) {
      // the attack is a typed quiz: the wild Lenguamon's own word, or sometimes a review word
      const rv = !first && rand() < 0.35 ? reviewWord(w) : null;
      first = false;
      const qw = rv || w;
      const st = S.stats[qw.key] || [0, 0];
      const dir = 'en2fa'; // always type the Persian
      const q = makeQuestion(qw, dir);
      const res = await quiz(q, `${esc(monW(BT.me).name)} attacks!`);
      stat(qw, res.ok);
      if (res.ok) {
        const crit = res.ms < 5000;
        await say(`${esc(monW(BT.me).name)} used ${W(monW(BT.me))}!`);
        SND.fx('hit'); await anim('#b-foe-spr', 'hurt', 450);
        const dmg = dmgRoll(5 + BT.me.lvl * 0.9) * (crit ? 1.5 : 1) | 0;
        BT.foe.hp = Math.max(0, BT.foe.hp - dmg); bDraw();
        if (crit) await say('Quick answer! A critical hit!');
        if (BT.foe.hp <= 0) {
          SND.fx('faint'); await anim('#b-foe-spr', 'faint', 600);
          await say([`Wild ${esc(w.name)} fainted!`, `It was carrying the word ${W(w)} = "${esc(w.en0)}".`]);
          await gainXp(BT.me, 4 + w.level * 3); break;
        }
      } else {
        SND.fx('miss'); await say([`${esc(monW(BT.me).name)}'s attack missed!`, `The answer was ${q.answerHtml}.`]);
      }
      if (!(await foeTurn(res.ok, q))) { await blackout(); return; }
    } else if (r === 1) {
      if (S.daftar <= 0) { await say("You're out of DAFTARS! Agha Reza at the teahouse can give you more."); continue; }
      S.daftar--;
      await say(`${esc(S.name)} opened a DAFTAR! Write the word to catch it!`);
      const q = makeQuestion(w, 'en2fa');
      const res = await quiz(q, 'Write it in your DAFTAR');
      stat(w, res.ok);
      if (!res.ok) {
        await say([`The ink smudged! The word slipped off the page.`, `The answer was ${q.answerHtml}.`]);
        if (!(await foeTurn(false, q))) { await blackout(); return; }
        continue;
      }
      const p = clamp(1 - 0.75 * BT.foe.hp / BT.foe.max + (res.ms < 6000 ? 0.1 : 0), 0.25, 0.97);
      const shakes = rand() < p ? 3 : Math.floor(rand() * 3);
      $('#b-foe-spr').innerHTML = `<div class="daftar-ico"></div>`;
      for (let i = 0; i < shakes; i++) { SND.fx('shake'); await anim('#b-foe-spr', 'shake', 500); }
      if (shakes === 3) {
        SND.fx('caught'); S.caught[w.key] = true;
        await say([`Gotcha! The wild ${B(w.name)} was caught!`, `Its word ${W(w)} = "${esc(w.en0)}" was written into your Lenguadex!`]);
        if (S.team.length < 6 && !S.team.some(m => m.key === w.key)) { S.team.push(makeMon(w)); await say(`${esc(w.name)} joined your team!`); }
        else await say(`${esc(w.name)} was stored in your Lenguadex. (Swap it in from the Lenguadex menu.)`);
        await gainXp(BT.me, 2 + w.level * 2);
        break;
      } else {
        bDraw(); await say(['Oh no! The word broke free!', 'Weaken it more before writing it down.']);
        if (!(await foeTurn(true, null))) { await blackout(); return; }
      }
    } else if (r === 2) {
      const i = await teamScreen(true);
      if (i === null || i < 0 || S.team[i] === BT.me) continue;
      await say(`Come back, ${esc(monW(BT.me).name)}! Go, ${esc(monW(S.team[i]).name)}!`);
      BT.me = S.team[i]; bDraw();
      if (!(await foeTurn(true, null))) { await blackout(); return; }
    } else if (r === 3) {
      SND.fx('door'); await say('Got away safely!'); break;
    }
  }
  writeSave(); await battleOutro();
}

function bossReplyWord(b, line) {
  const sub = s => s.replace(/\{NAME\}/g, S.name);
  const tr = sub(line[4]);
  return { key: 'boss|' + norm(tr), tr0: tr, en0: sub(line[5]), fa: line[3].replace(/\{NAME\}/g, S.name), trForms: [norm(tr)], enForms: [norm(sub(line[5]))] };
}
async function bossBattle(id) {
  const b = BOSSES[id];
  BT.boss = { ...b, total: b.lines.length, left: b.lines.length };
  BT.foe = { w: WORD[WORDS[0].key], lvl: b.lvl, max: 1, hp: 1 };
  BT.me = lead();
  await battleIntro('boss');
  await say(`${b.name} wants to have a conversation! Answer each line in Persian.`);
  if (b.showEn) await say(`(${b.name} will give you English hints. Type the best Persian reply.)`);
  else await say(`(No English hints this time. Listen to the Persian and reply!)`);
  await say(`Go! ${B(monW(BT.me).name)}!`);
  const queue = b.lines.map((l, i) => i);
  while (queue.length) {
    bDraw();
    const li = queue.shift(), line = b.lines[li];
    const ans = bossReplyWord(b, line);
    const others = shuffle(b.lines.filter((l, i) => i !== li)).slice(0, 3).map(l => bossReplyWord(b, l));
    const fx = s => s.replace(/\{NAME\}/g, S.name);
    const opts = shuffle([ans, ...others]).map(x => ({ word: x, correct: x === ans, forms: x.trForms, html: F(x.fa, x.tr0) + (b.optEn ? `<span class="en sm">${esc(x.en0)}</span>` : '') }));
    const q = {
      boss: true, w: ans, opts, hint: 'Type your reply (Latin letters)',
      prompt: `<span class="who">${esc(b.name)}:</span> ${F(fx(line[0]), fx(line[1]))}${b.showEn ? `<span class="en sm">"${esc(fx(line[2]))}"</span>` : ''}`,
      answerHtml: `${F(ans.fa, ans.tr0)} <small>"${esc(ans.en0)}"</small>`,
    };
    const res = await quiz(q, 'Your reply');
    if (res.ok) {
      await say(`${esc(monW(BT.me).name)} replied: ${F(ans.fa, ans.tr0)}`);
      SND.fx('hit'); await anim('#b-foe-spr', 'hurt', 400);
      BT.boss.left--; bDraw();
      if (!b.showEn) await say(`(${b.name} said: "${esc(fx(line[2]))}" · You said: "${esc(ans.en0)}")`);
      if (!BT.boss.left) break;
      if (!(await foeTurn(true, null))) { await blackout(); return false; }
    } else {
      queue.push(li);
      await say([`That reply didn't fit the conversation!`, `A good reply: ${q.answerHtml}`]);
      if (!(await foeTurn(false, q))) { await blackout(); return false; }
    }
  }
  SND.fx('badge');
  await say(`${b.name}: ${b.beaten}`);
  writeSave(); await battleOutro();
  return true;
}

async function gateBoss(id) {
  const b = BOSSES[id], name = b.name, routeName = ROUTE_NAMES[b.route];

  if (have < b.need) {
    await say([`(To pass, you must hold a conversation with ${name} in Persian.)`, `(First catch at least ${B(b.need)} Lenguamon around ${esc(routeName)}. You have ${B(have)}.)`]);
    return;
  }
  if (!(await ask(`${name}: Are you ready to talk? ${F('آماده‌ای؟', 'amadeyi?')}`))) { await say(T(name, `${F('باشه', 'bashe')}. Come back when you are ready.`)); return; }
  if (!teamAlive()) { await say('Your Lenguamon are too tired. Rest first!'); return; }
  const won = await bossBattle(id);
  if (!won) return;
  S.flags[id] = true; S.daftar += 5; healTeam();
  SND.fx('badge');
  await say([`${esc(S.name)} earned the ${B(['', 'YAZD', 'ISFAHAN', 'SHIRAZ'][+id[1]] + ' KASHI BADGE')}!`, `You found 5 DAFTARS, and your Lenguamon were healed.`]);

// ===== LENGUAMON boot =====
function layout() {
  const W = window.innerWidth, H = window.innerHeight, narrow = W < 600;
  const chromeW = narrow ? 22 : 64;              // shell + bezel + screen border, left and right
  const chromeH = narrow ? 44 : 140;             // bezel top bar + paddings (+ key hints on desktop)
  const controls = narrow ? Math.min(260, Math.max(200, H * 0.3)) : 150;
  let u = Math.min((W - chromeW) / 160, (H - chromeH - controls) / 144, 900 / 160);
  u = Math.max(1.6, Math.floor(u * 8) / 8);
  document.documentElement.style.setProperty('--u', u + 'px');
}
window.addEventListener('resize', layout);
window.addEventListener('orientationchange', () => setTimeout(layout, 200));
// keep the game screen visible when the phone keyboard opens
if (window.visualViewport) visualViewport.addEventListener('resize', () => { if (document.activeElement && document.activeElement.tagName === 'INPUT') window.scrollTo(0, 0); });

(function boot() {
  applyOpts(); layout(); buildMaps(); bindTouch();
  requestAnimationFrame(loop);
  const { expired } = readSave();
  titleScreen(expired);
})();

</script>
